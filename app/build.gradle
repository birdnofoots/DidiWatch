plugins { id 'com.android.application' }

android {
    namespace 'com.birdnofoots.eventviewer'
    compileSdk 34
    defaultConfig {
        applicationId 'com.birdnofoots.eventviewer'
        minSdk 24
        targetSdk 34
        versionCode 11
        versionName '0.8.2'
    }
    signingConfigs {
        release {
            def ks = System.getenv('ANDROID_KEYSTORE_PATH')
            if (ks != null && !ks.isEmpty() && file(ks).exists()) {
                storeFile file(ks)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias     System.getenv('ANDROID_KEY_ALIAS')
                keyPassword  System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (signingConfigs.release.storeFile != null) signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies { implementation project(':lib') }
