name: DidiWatch

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
    - name: Checkout the code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Ensure Android SDK 34
      run: |
        SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
        [ -x "$SDKMANAGER" ] || SDKMANAGER=$(command -v sdkmanager || true)
        if [ -n "$SDKMANAGER" ]; then
          yes | "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" || true
        fi

    # 固定签名密钥库(GitHub Secrets, AES 加密存储, 不进仓库)
    # 未配置时优雅降级为 debug 签名(只是无法覆盖安装, 构建仍会成功)
    - name: Prepare signing keystore
      env:
        KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      run: |
        if [ -n "$KS_B64" ]; then
          printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "OK: 使用固定密钥签名"
        else
          echo "::warning::未配置 ANDROID_KEYSTORE_BASE64, 将使用 debug 签名(APK 之间无法互相覆盖安装)"
        fi

    - name: Build release APK
      run: |
        chmod +x gradlew
        ./gradlew :app:assembleRelease --stacktrace

    - name: Print APK signature fingerprints
      run: |
        for f in app/build/outputs/apk/release/*.apk; do
          [ -f "$f" ] || continue
          echo "===== $f"
          "$JAVA_HOME/bin/keytool" -printcert -jarfile "$f" 2>/dev/null | grep -E "SHA1:|SHA256:" | head -2
        done

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: didiwatch-apk
        path: app/build/outputs/apk/release/*.apk
        if-no-files-found: error
        retention-days: 30
